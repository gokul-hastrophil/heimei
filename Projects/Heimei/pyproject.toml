[project]
name = "heimei"
version = "0.1.0"
description = "Personal AI Operating Layer"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "typer",
    "rich",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "loguru",
    "psutil",
    "platformdirs"
]

[project.scripts]
heimei = "heimei.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heimei"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "types-psutil>=7.2.2.20260518",
    "types-pyyaml>=6.0.12.20260724",
]
